name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev,hnsw]"
      - name: Lint
        run: ruff check omnidb_server/ tests/
      - name: Type check
        # tests/ remains exempt because its untyped fixtures exercise runtime behavior.
        run: mypy omnidb_server/
      - name: Tests with branch coverage
        # AUDIT-I14: measured baseline 85.3% branch (2026-09-18, full suite);
        # 80% is the enforced floor with headroom for platform-conditional
        # branches (msvcrt/fcntl paths do not both execute on one runner).
        env:
          OMNIDB_RUN_PERF: "1"
        run: python -m pytest -q --cov=omnidb_server --cov-branch --cov-fail-under=80 --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml

  # The pure ranking modules (fusion.py, scoring.py) carry all ranking
  # behaviour in ~70 lines, so their mutation score is the cheapest available
  # proxy for "does this suite actually test ranking". docs/mutation-report.md
  # measured 33%; the exact-value tests in tests/test_fusion_values.py and
  # tests/test_scoring_values.py take it to 100% (29/29, one declared equivalent
  # mutant). Gated at 85 so a future regression is visible before it is 33%.
  mutation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Mutation score gate (fusion.py + scoring.py)
        # Exits non-zero below --min-score, and also on any NOT_APPLICABLE
        # anchor: a stale mutation-table entry looks identical to an unkilled
        # mutant, so it must fail loudly rather than quietly deflate the score.
        run: python scripts/mutation_check.py --min-score 85
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-results
          path: docs/mutation-report.md

  # AUDIT-I14: mandatory supported backend job; skip outcomes are failures.
  hnsw-required:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install supported HNSW backend
        run: pip install -e ".[dev,hnsw]"
      - name: Require working native backend import
        run: python -c "import hnswlib; assert hasattr(hnswlib, 'Index')"
      - name: Backend contracts
        run: >-
          python -m pytest -q --junitxml=hnsw-results.xml
          tests/test_reconcile.py::test_hnsw_reconciliation
          tests/test_db.py::test_hnsw_roundtrip_and_reopen
          tests/test_issue_fixes.py::test_compaction_scheduled_then_rebuilt_on_open
          tests/test_audit_remediation.py::test_ef_search_config_reaches_hnsw
      - name: Forbid backend skips and missing test cases
        if: always()
        run: >-
          python -c "import xml.etree.ElementTree as E;
          cases = E.parse('hnsw-results.xml').getroot().findall('.//testcase');
          assert len(cases) >= 4, 'required backend cases were not collected';
          assert all(c.find('skipped') is None and c.find('failure') is None and c.find('error') is None for c in cases), 'required backend tests skipped or failed'"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hnsw-required-results
          path: hnsw-results.xml

  benchmark-gate:
    needs: [test, hnsw-required, mutation-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -e ".[dev,hnsw,semantic]"
      - name: Semantic recall gate
        env:
          OMNIDB_TEST_SEMANTIC: "1"
        run: python -m pytest -q tests/test_semantic.py
      - name: Vector baseline gate
        run: python bench/baseline.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bench-results
          path: bench/results.md
