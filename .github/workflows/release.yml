name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "pyproject.toml"
      - "MANIFEST.in"

jobs:
  # PR job: build + validate the distribution but never upload.
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Twine check
        run: python -m twine check dist/*

  # Tag job: build, validate, and publish to PyPI.
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing: PyPI exchanges this OIDC token for an upload
      # credential. No PYPI_API_TOKEN secret is used or needed.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Twine check
        run: python -m twine check dist/*
      # NOTE: one-time setup by the repo owner — on pypi.org, under the
      # omnidb-server project's Publishing settings, add a Trusted Publisher
      # pointing at this repository + workflow file
      # (.github/workflows/release.yml) + environment name (pypi). Without
      # that registration PyPI rejects the OIDC-based upload.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
