name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "pyproject.toml"
      - "MANIFEST.in"
      - "LICENSE"
      - "NOTICE"

jobs:
  # PR job: build + validate the distribution but never upload.
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Assert the sdist ships LICENSE and NOTICE
        # This is the check that was missing when 0.1.0-0.1.3 advertised
        # Apache-2.0 on PyPI while shipping no LICENSE at all. `twine check`
        # passes happily on a distribution with no license file, and a
        # declared `license` string is not proof the file was packaged, so
        # the archive itself has to be opened and inspected.
        run: |
          set -euo pipefail
          SDIST=$(ls -1 dist/*.tar.gz)
          echo "Inspecting $SDIST"
          MEMBERS=$(tar -tzf "$SDIST")
          MISSING=0
          for f in LICENSE NOTICE; do
            if echo "$MEMBERS" | grep -qE "/${f}\$"; then
              echo "OK: $f is present in the sdist"
            else
              echo "ERROR: $f is MISSING from the sdist" >&2
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "Refusing to publish: the distribution must carry its license." >&2
            exit 1
          fi
          # The packaged LICENSE must be the real Apache-2.0 text, not a stub.
          tar -xzOf "$SDIST" --wildcards '*/LICENSE' | head -3 | grep -q "Apache License" \
            || { echo "ERROR: packaged LICENSE is not Apache-2.0 text" >&2; exit 1; }
      - name: Twine check
        run: python -m twine check dist/*

  # Tag job: build, validate, and publish to PyPI.
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing: PyPI exchanges this OIDC token for an upload
      # credential. No PYPI_API_TOKEN secret is used or needed.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Assert the sdist ships LICENSE and NOTICE
        # Repeated here (not just in the dry-run job) because a tag push can
        # land without any PR ever having run. This step is the last gate
        # before the upload, so it must fail loudly and unconditionally.
        run: |
          set -euo pipefail
          SDIST=$(ls -1 dist/*.tar.gz)
          echo "Inspecting $SDIST"
          MEMBERS=$(tar -tzf "$SDIST")
          MISSING=0
          for f in LICENSE NOTICE; do
            if echo "$MEMBERS" | grep -qE "/${f}\$"; then
              echo "OK: $f is present in the sdist"
            else
              echo "ERROR: $f is MISSING from the sdist" >&2
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "Refusing to publish: the distribution must carry its license." >&2
            exit 1
          fi
          tar -xzOf "$SDIST" --wildcards '*/LICENSE' | head -3 | grep -q "Apache License" \
            || { echo "ERROR: packaged LICENSE is not Apache-2.0 text" >&2; exit 1; }
      - name: Twine check
        run: python -m twine check dist/*
      # NOTE: one-time setup by the repo owner — on pypi.org, under the
      # omnidb-server project's Publishing settings, add a Trusted Publisher
      # pointing at this repository + workflow file
      # (.github/workflows/release.yml) + environment name (pypi). Without
      # that registration PyPI rejects the OIDC-based upload.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
