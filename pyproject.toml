[build-system]
# PEP 639 (SPDX `license` string + `license-files`) needs setuptools>=77.
# 68 is the old floor and would reject the metadata below as an invalid
# license table, so the floor is raised deliberately.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omnidb-server"
version = "0.1.3"
description = "MCP-native agent memory & retrieval server over SQLite (WAL + FTS5) with an hnswlib vector sidecar."
readme = "README.md"
# PEP 639 SPDX string form. The old table form (a `text` key inside a license
# table) is deprecated and, worse, validated nothing: it advertised Apache-2.0
# for releases that shipped no LICENSE file at all (0.1.0-0.1.3).
# `license-files` makes setuptools *fail the build* when a listed file is
# missing, so the declaration can no longer drift from reality.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["mcp>=1.9,<2", "numpy>=1.26", "httpx>=0.27"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    # NOTE: "Framework :: MCP :: Server" is not a registered trove
    # classifier and made `python -m build` fail validation (2026-09-19);
    # MCP is described in the README/description instead.
]

[project.optional-dependencies]
semantic = ["fastembed>=0.3"]
hnsw = ["hnswlib>=0.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "hypothesis>=6.100", "mypy==1.19.1"]

[project.scripts]
omnidb-server = "omnidb_server.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/omnidb-server/"
# placeholder until the repo lands under its final owner; resolves to the README
Documentation = "https://github.com/yourname/omnidb-server#readme"

[tool.setuptools.packages.find]
# DEBT-02: the wheel ships only the package — tests/docs/bench/scripts stay
# in the sdist (MANIFEST.in) instead of installing top-level `tests` and
# `docs` packages that collide on sys.path.
include = ["omnidb_server*"]
namespaces = true

[tool.setuptools.package-data]
omnidb_server = ["py.typed"]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# bench scripts insert the repo root on sys.path before importing sibling
# modules (research_bench_v3, probe_rerank_window), so imports legitimately
# sit below module-level code.
[tool.ruff.lint.per-file-ignores]
"bench/*.py" = ["E402"]

[tool.mypy]
# python_version is intentionally unpinned: the interpreter-default target
# stays compatible with the numpy stubs in each environment
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
# kept lenient for v1: the goal is a green gate that stays green, not full strictness
exclude = ["bench", "build_check_dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "perf: opt-in perf gates (skipped by default; set OMNIDB_RUN_PERF=1)",
]

[tool.coverage.run]
source = ["omnidb_server"]
omit = ["omnidb_server/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
precision = 1
